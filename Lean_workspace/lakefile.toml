name = "lean_workspace"
version = "0.1.0"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Our two files: Out.lean is generated by Vehicle, Proof.lean imports it.
[[lean_lib]]
name = "LeanWorkspace"
roots = ["Out", "Proof"]
